<!doctype html><html lang="he"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>תפאורה שחורצי</title>
<meta property="og:title" content="תפאורה שחורצי">
<meta property="og:description" content="דעות, טעות, סליחה, חרב, חבר, חברות">
<meta name="description" content="תפאורה שחורצי: דעות, טעות, סליחה, חרב, חבר, חברות">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@900&family=Assistant:wght@500;700&display=swap">
<style>
  :root{
    --wall:#4a9fd6; --floor:#b9c6d2; --ink:#1b2f86; --paper:#f3f6f9; --text:#1c2733; --muted:#5b6b7a;
    --u:min(1px, calc((100vw - 32px) / 640));
    color-scheme:light;
  }
  html,body{background:var(--paper);color:var(--text)}
  body{font-family:"Assistant",system-ui,sans-serif;padding-inline:16px;padding-block:24px 40px;margin:0}
  .wrap{max-width:900px;margin:0 auto;display:grid;gap:20px}
  h1{margin:0;font:700 22px/1.2 "Assistant",sans-serif;text-wrap:balance}
  h2{margin:0;font:700 19px/1.2 "Assistant",sans-serif}
  .scene{position:relative;border-radius:10px;overflow:hidden;
    background:linear-gradient(#2e3640 0 66%, var(--floor) 66% 100%);
    padding-block:calc(200 * var(--u)) calc(34 * var(--u));
    display:flex;justify-content:center;align-items:flex-end;gap:calc(18 * var(--u));direction:ltr}

  /* Backdrop: one continuous sky-print fabric, stretched over the aluminium frame from the floor up. */
  .drop{position:absolute;z-index:0;inset:0 0 34% 0;box-sizing:border-box;
    border:calc(6 * var(--u)) solid #b9c0c7;border-bottom:0;
    border-image:linear-gradient(135deg,#eef1f4,#9aa3ac 45%,#d7dce1 70%,#8b949d) 1;
    background:
      radial-gradient(ellipse 9% 5% at 14% 22%,#fff 0 55%,transparent 72%),
      radial-gradient(ellipse 7% 6% at 19% 19%,#fff 0 55%,transparent 72%),
      radial-gradient(ellipse 8% 4.5% at 23% 24%,#fbfdff 0 55%,transparent 72%),
      radial-gradient(ellipse 11% 5% at 63% 14%,#fff 0 55%,transparent 72%),
      radial-gradient(ellipse 7% 6.5% at 69% 10%,#fff 0 55%,transparent 72%),
      radial-gradient(ellipse 9% 4.5% at 75% 15%,#f7fbff 0 55%,transparent 72%),
      radial-gradient(ellipse 8% 4% at 42% 46%,rgba(255,255,255,.85) 0 50%,transparent 72%),
      radial-gradient(ellipse 6% 4% at 46% 43%,rgba(255,255,255,.85) 0 50%,transparent 72%),
      radial-gradient(ellipse 10% 4% at 88% 52%,rgba(255,255,255,.8) 0 50%,transparent 72%),
      radial-gradient(ellipse 9% 3.5% at 6% 58%,rgba(255,255,255,.75) 0 50%,transparent 72%),
      linear-gradient(#2f7fd0,#5ea8e6 55%,#a9d4f5)}
  /* Backdrop rigging demo: the bare aluminium frame with Velcro strips, then the sky fabric comes down onto it. */
  .frame{position:absolute;z-index:0;inset:0 0 34% 0;opacity:0;transition:opacity .5s ease}
  .scene.rig .frame{opacity:1}
  .bar{position:absolute;background:linear-gradient(90deg,#8b949d,#eef1f4 40%,#b9c0c7 60%,#7d868f)}
  .bar.h{left:0;right:0;height:calc(10 * var(--u));background:linear-gradient(#8b949d,#eef1f4 40%,#b9c0c7 60%,#7d868f)}
  .bar.v{top:0;bottom:0;width:calc(10 * var(--u))}
  .velcro{position:absolute;background:repeating-linear-gradient(45deg,#1f1f1f 0 2px,#3b3b3b 2px 4px);border-radius:2px}
  /* Pressing: the strips glow through the fabric where it grips. */
  .scene.rig.press .frame{z-index:1}
  .scene.rig.press :is(.bar,.tag){opacity:0}
  .scene.rig.press .velcro{background:#ffd34d;opacity:0;animation:press .8s ease-in-out 4}
  @keyframes press{50%{opacity:.85}}
  .tag{position:absolute;top:calc(22 * var(--u));left:50%;transform:translateX(-50%);direction:rtl;white-space:nowrap;
    background:#ffd34d;color:#1c2733;font:700 calc(15 * var(--u))/1 "Assistant",sans-serif;padding:calc(6 * var(--u)) calc(10 * var(--u));border-radius:6px}
  .roll{position:absolute;z-index:1;left:0;right:0;top:0;height:calc(16 * var(--u));border-radius:calc(8 * var(--u));opacity:0;
    background:linear-gradient(#a9d4f5,#5ea8e6 45%,#2f7fd0);box-shadow:0 calc(4 * var(--u)) calc(8 * var(--u)) rgba(0,0,0,.35)}
  .scene.rig .cube{opacity:.25}
  .cube{--z:calc(var(--s) * var(--u));width:var(--z);height:var(--z);flex:none;z-index:1;
    perspective:calc(var(--z) * 5);perspective-origin:28% 8%}
  .body{position:relative;width:100%;height:100%;transform-style:preserve-3d;
    transition:transform 1.1s cubic-bezier(.55,-.15,.3,1.25)}
  .f{position:absolute;inset:0;display:grid;place-items:center;background:var(--c);
    border:1px solid rgba(0,0,0,.14);backface-visibility:hidden;
    font:900 calc(var(--z) * .5)/1 "Frank Ruhl Libre","David","Times New Roman",serif;color:var(--ink)}
  .front{transform:translateZ(calc(var(--z) / 2))}
  .left{transform:rotateY(-90deg) translateZ(calc(var(--z) / 2));filter:brightness(.93)}
  .back{transform:rotateY(180deg) translateZ(calc(var(--z) / 2))}
  .right{transform:rotateY(90deg) translateZ(calc(var(--z) / 2))}
  .top{transform:rotateX(90deg) translateZ(calc(var(--z) / 2))}
  .bottom{transform:rotateX(-90deg) translateZ(calc(var(--z) / 2))}
  .f b{display:block;transform:rotate(var(--r,0deg))}
  /* The open side: a rim of the cube colour around a dark hollow, so the cubes nest. */
  .hole::after{content:"";position:absolute;inset:9%;border-radius:2px;
    background:radial-gradient(ellipse at 50% 35%,#4a4a4a 0,#1d1d1d 55%,#090909 100%);
    box-shadow:inset 0 calc(var(--z) * .05) calc(var(--z) * .08) rgba(0,0,0,.8)}
  .ball{width:32%;height:32%;border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#6b6b6b 0,#1a1a1a 38%,#000 70%);
    box-shadow:calc(var(--z) * .04) calc(var(--z) * .06) calc(var(--z) * .08) rgba(0,0,0,.45)}
  .wdot{position:absolute;width:4.8%;height:4.8%;border-radius:50%;background:#fff;transform:translate(-50%,-50%)}
  .dot{position:absolute;left:var(--x);top:var(--y);width:7%;height:7%;border-radius:50%;background:#000;transform:translate(-50%,-50%)}

  /* Steps 1-2 turn cubes a quarter to the left. Step 3 tips ח-ר-ב forward onto their tops,
     while ו and ת tip backward and show their open side. Step 4 puts ב/ר back (חבר) while ו and ת stay open; step 5 flips them over: חברות. */
  .body{transform:rotateX(0deg) rotateY(0deg)}
  .scene[data-step="1"] .pink .body,.scene[data-step="1"] .orange .body{transform:rotateX(0deg) rotateY(-90deg)}
  .scene[data-step="2"] .body{transform:rotateX(0deg) rotateY(-90deg)}
  .scene[data-step="2"] .pink .body,.scene[data-step="2"] .orange .body{transform:rotateX(0deg) rotateY(-180deg)}
  .scene:is([data-step="3"],[data-step="4"],[data-step="5"]) .body{transform:rotateX(-90deg) rotateY(-90deg)}
  .scene:is([data-step="3"],[data-step="4"],[data-step="5"]) :is(.pink,.orange) .body{transform:rotateX(-90deg) rotateY(-180deg)}
  .scene:is([data-step="3"],[data-step="4"]) .yellow .body{transform:rotateX(90deg) rotateY(-90deg)}
  .scene:is([data-step="3"],[data-step="4"]) .orange .body{transform:rotateX(90deg) rotateY(-180deg)}
  .scene[data-step="1"] .orange .body{transition-delay:.25s}
  .scene[data-step="2"] .purple .body,.scene[data-step="3"] .purple .body{transition-delay:.15s}
  .scene[data-step="2"] .green .body,.scene[data-step="3"] .green .body{transition-delay:.3s}
  .scene[data-step="2"] .yellow .body,.scene[data-step="3"] .yellow .body{transition-delay:.45s}
  .scene[data-step="2"] .orange .body,.scene[data-step="3"] .orange .body{transition-delay:.6s}
  .scene[data-step="5"] .orange .body{transition-delay:.2s}
  .scene.peek .body{transition-delay:0s!important}

  /* ב and ר trade places in step 3 (script) and come back in step 4. */
  .cube{position:relative}
  .orange{order:1}.yellow{order:2}.green{order:3}.purple{order:4}.pink{order:5}
  .scene.swapped .green{order:4}.scene.swapped .purple{order:3}
  .hop{z-index:2}
  /* Packing (last step): every cube turns its open side up and the camera looks down into them,
     then each one drops into the next bigger one, biggest first. */
  .scene[data-step="6"] .body{transform:rotateX(180deg) rotateY(0deg);transition-delay:0s}
  .scene[data-step="6"] .cube{perspective-origin:50% -80%}
  .scene.xray .cube:not(.pink){opacity:.5}
  .scene.xray .cube{perspective-origin:50% 8%}
  .scene .cube{transition:opacity .6s ease,perspective-origin 1s ease}

  .panel{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
  .word{font:900 34px/1 "Frank Ruhl Libre",serif;color:var(--ink);min-height:34px;letter-spacing:.04em}
  .steps{color:var(--muted);font-size:14px}
  .btns{display:flex;gap:10px;flex-wrap:wrap}
  button{font:700 16px/1 "Assistant",sans-serif;border-radius:8px;padding:13px 20px;cursor:pointer;border:2px solid var(--ink)}
  #next{background:var(--ink);color:#fff}
  #reset,#empties,#rigBtn{background:transparent;color:var(--ink)}
  button:focus-visible{outline:3px solid #e8784a;outline-offset:2px}
  button:disabled{opacity:.45;cursor:default}

  /* Face map: every cube unfolded, so the free sides are easy to spot. */
  .faces{display:grid;gap:14px;border-top:1px solid #d5dde5;padding-top:20px}
  .lead{margin:0;color:var(--muted);font-size:15px;line-height:1.5}
  .tally{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:15px}
  .tally span{display:inline-flex;align-items:center;gap:6px}
  .sw{width:14px;height:14px;border-radius:3px;display:inline-block}
  .nets{direction:ltr;display:flex;flex-wrap:wrap;gap:18px 22px;justify-content:center}
  .net{display:grid;gap:6px;justify-items:center}
  .net h3{margin:0;font:700 15px/1 "Assistant",sans-serif}
  .grid{direction:ltr;display:grid;grid-template-columns:repeat(4,40px);grid-template-rows:repeat(3,40px);gap:3px}
  .tile{display:grid;place-items:center;border-radius:4px;background:var(--c);color:var(--ink);cursor:pointer;
    font:900 21px/1 "Frank Ruhl Libre",serif;border:2px solid transparent;padding:0;position:relative}
  .tile small{font:700 11px/1 "Assistant",sans-serif}
  .tile.empty{background:#fff;border:2px dashed var(--c);color:#3d4a57}
  .tile.hole{background:#1d1d1d;color:#fff;border-color:var(--c)}
  .tile.art{font-size:13px}
  .tile[aria-pressed="true"]{outline:3px solid var(--ink);outline-offset:1px}
  .ideas{margin:0;padding-inline-start:20px;line-height:1.6;font-size:15px}
  /* 3D stage: a button in the title row opens it in a full dialog. */
  .titlebar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
  #open3d,#drag3d{background:#e8784a;border-color:#e8784a;color:#fff}
  .dlg3d{width:min(1100px,calc(100vw - 24px));max-width:none;max-height:calc(100vh - 24px);border:0;border-radius:12px;padding:16px;
    background:var(--paper);color:var(--text);direction:rtl;display:none;gap:12px}
  .dlg3d[open]{display:grid}
  .dlg3d::backdrop{background:rgba(10,14,20,.7)}
  .dlghead{display:flex;justify-content:space-between;align-items:center}
  #close3d{padding:8px 13px;background:transparent;color:var(--ink)}
  .stage3d{border-radius:10px;overflow:hidden;background:#1d232b;min-height:280px;touch-action:none;direction:ltr}
  .stage3d canvas{display:block;width:100%!important}
  .view{background:transparent;color:var(--ink)}
  .view[aria-pressed="true"]{background:var(--ink);color:#fff}
  @media (prefers-reduced-motion:reduce){.body,.ball{transition-duration:.01s!important;transition-delay:0s!important}}
</style>

<div class="wrap" dir="rtl">
  <div class="titlebar">
    <h1>תפאורה שחורצי</h1>
    <button id="open3d" type="button">🎭 הבמה בתלת מימד</button>
  </div>

  <div class="scene" id="scene" data-step="0" aria-live="polite">
    <div class="frame" id="frame" aria-hidden="true"></div>
    <div class="drop" id="drop" aria-hidden="true"></div>
    <div class="roll" id="roll" aria-hidden="true"></div>
  </div>

  <div class="panel">
    <div>
      <div class="word" id="word">דעות</div>
      <div class="steps" id="stepText">המצב ההתחלתי</div>
    </div>
    <div class="btns">
      <button id="next" type="button">סובב</button>
      <button id="reset" type="button" disabled>מההתחלה</button>
      <button id="rigBtn" type="button">איך מלבישים את הרקע</button>
    </div>
  </div>

  <section class="faces" aria-labelledby="facesTitle">
    <h2 id="facesTitle">אילו צדדים פנויים?</h2>
    <p class="lead">כל קוביה פרושה לשש הפאות שלה. לחיצה על פאה מסובבת את הקוביה למעלה כך שהפאה הזו פונה לקהל.</p>
    <div class="tally" id="tally"></div>
    <div class="nets" id="nets"></div>
    <div class="btns"><button id="empties" type="button">הצג את כל הצדדים הריקים</button></div>
    <ul class="ideas" id="ideas"></ul>
  </section>

  <dialog id="dlg3d" class="dlg3d" aria-labelledby="stageTitle">
    <div class="dlghead">
      <h2 id="stageTitle">הבמה בתלת מימד</h2>
      <button id="close3d" type="button" aria-label="סגור">✕</button>
    </div>
    <p class="lead">קוביות עץ שאפשר לעמוד עליהן, ומאחוריהן מעבר לשחקן עד בד השמיים. גוררים כדי לסובב, וגלגלת או צביטה לזום.</p>
    <div class="btns">
      <button class="view" type="button" data-view="audience">מהקהל</button>
      <button class="view" type="button" data-view="side">מהצד</button>
      <button class="view" type="button" data-view="top">מלמעלה</button>
      <button class="view" type="button" data-view="back">מאחורי הקלעים</button>
      <button id="drag3d" type="button">▶ ארוז וגרור החוצה</button>
    </div>
    <div id="stage3d" class="stage3d"></div>
    <p class="lead" id="stageNote"></p>
  </dialog>
</div>


<script>
  // One place that says what is painted on every side of every cube.
  // null = empty side, 'hole' = the open side the cubes nest through.
  // The pink cube is the innermost one, so it is closed all round.
  const CUBES = [
    {k:'orange', name:'הכתומה', s:130, c:'#e8784a', end:-180,
      faces:{front:{art:'ball'}, right:{art:'dots'}, back:'ה', left:null, top:{w:'ת'}, bottom:'hole'}},
    {k:'yellow', name:'הצהובה', s:118, c:'#e8c957', end:-90,
      faces:{front:'ת', right:'ח', back:null, left:null, top:{w:'ו'}, bottom:'hole'}},
    {k:'green', name:'הירוקה', s:106, c:'#9ccb82', end:-90,
      faces:{front:'ו', right:'י', back:null, left:null, top:{w:'ר'}, bottom:'hole'}},
    {k:'purple', name:'הסגולה', s:96, c:'#bb8cd2', end:-90,
      faces:{front:'ע', right:'ל', back:null, left:null, top:{w:'ב'}, bottom:'hole'}},
    {k:'pink', name:'הוורודה', s:86, c:'#db8f98', end:-180,
      faces:{front:'ד', right:'ט', back:'ס', left:null, top:{w:'ח'}, bottom:null}}
  ];
  const SIDES = ['front','right','back','left','top','bottom'];
  const SIDE_NAME = {front:'חזית', right:'צד ימין', back:'גב', left:'צד שמאל', top:'למעלה', bottom:'למטה'};
  // Net position (column,row) in a cross: top above the front, bottom below it.
  const NET = {top:[2,1], left:[1,2], front:[2,2], right:[3,2], back:[4,2], bottom:[2,3]};
  const SPOTS = [[21,27],[70,22],[42,48],[79,64],[26,76],[59,83]];
  const WDOTS = [[13,15],[37,12],[66,17],[87,14],[22,34],[51,29],[79,37],[12,54],[33,61],[73,59],[89,68],[20,81],[48,86],[78,82]];

  const scene = document.getElementById('scene');
  const kind = v => v === null ? 'empty' : v === 'hole' ? 'hole' : (v.art ? 'art' : 'letter');

  CUBES.forEach((cube, i) => {
    const el = document.createElement('div');
    el.className = 'cube ' + cube.k;
    el.style.cssText = `--s:${cube.s};--c:${cube.c}`;
    const body = document.createElement('div');
    body.className = 'body';
    SIDES.forEach(side => {
      const v = cube.faces[side], f = document.createElement('div');
      f.className = 'f ' + side;
      if (v === 'hole') f.classList.add('hole');
      else if (typeof v === 'string') f.textContent = v;
      else if (v && v.art === 'ball') f.innerHTML = '<span class="ball"></span>';
      else if (v && v.art === 'dots') f.innerHTML = SPOTS.map(([x, y]) => `<span class="dot" style="--x:${x}%;--y:${y}%"></span>`).join('');
      else if (v && v.w) {
        // The חברות letters sit on top; turn them so they read upright once tipped forward.
        f.innerHTML = `<b style="--r:${cube.end === -180 ? 180 : -90}deg">${v.w}</b>`;
        WDOTS.forEach(([x, y]) => {
          const d = document.createElement('span');
          d.className = 'wdot';
          d.style.left = (i % 2 ? 100 - x : x) + '%';
          d.style.top = y + '%';
          f.appendChild(d);
        });
      }
      body.appendChild(f);
    });
    el.appendChild(body);
    scene.appendChild(el);
    cube.el = el;
    cube.body = body;
  });

  // Turn one cube so the chosen side faces the audience.
  const facing = (cube, side) => ({
    front:'rotateX(0deg) rotateY(0deg)', right:'rotateX(0deg) rotateY(-90deg)',
    back:'rotateX(0deg) rotateY(-180deg)', left:'rotateX(0deg) rotateY(90deg)',
    top:`rotateX(-90deg) rotateY(${cube.end}deg)`, bottom:'rotateX(90deg) rotateY(0deg)'
  })[side];

  // ---- Face map ----
  const nets = document.getElementById('nets');
  const count = {letter:0, art:0, empty:0, hole:0};
  CUBES.forEach(cube => {
    const box = document.createElement('div');
    box.className = 'net';
    box.innerHTML = `<h3>${cube.name}</h3>`;
    const grid = document.createElement('div');
    grid.className = 'grid';
    grid.style.setProperty('--c', cube.c);
    SIDES.forEach(side => {
      const v = cube.faces[side], k = kind(v), t = document.createElement('button');
      count[k]++;
      t.type = 'button';
      t.className = 'tile ' + k;
      t.style.gridArea = `${NET[side][1]} / ${NET[side][0]}`;
      t.setAttribute('aria-pressed', 'false');
      t.title = SIDE_NAME[side];
      t.innerHTML = k === 'empty' ? '<small>ריק</small>' : k === 'hole' ? '<small>חור</small>'
        : k === 'art' ? (v.art === 'ball' ? '⚫' : '⁘') : (v.w || v);
      t.addEventListener('click', () => peekOne(cube, side, t));
      grid.appendChild(t);
    });
    box.appendChild(grid);
    nets.appendChild(box);
  });
  const sw = c => `<i class="sw" style="${c}"></i>`;
  document.getElementById('tally').innerHTML =
    `<span>${sw('background:#e8c957')}${count.letter} עם אות</span>` +
    `<span>${sw('background:#e8784a')}${count.art} עם ציור</span>` +
    `<span>${sw('background:#fff;border:2px dashed #8a97a5')}<b>${count.empty} ריקים</b></span>` +
    `<span>${sw('background:#1d1d1d')}${count.hole} חורים (צד פתוח)</span>`;
  const emptyLeft = CUBES.filter(c => c.faces.left === null).length;
  const emptyBack = CUBES.filter(c => c.faces.back === null).map(c => c.name);
  document.getElementById('ideas').innerHTML =
    `<li>צד שמאל ריק ב־${emptyLeft} הקוביות: סיבוב של כולן ימינה יכול לחשוף מילה נוספת של ${emptyLeft} אותיות.</li>` +
    `<li>הגב ריק ב${emptyBack.join(', ')}: מקום למילה של ${emptyBack.length} אותיות, או לנקודות כמו בכתומה.</li>` +
    `<li>החור תמיד על הרצפה, חוץ מהרגע שבו ו ו־ת מתהפכות אליו, אז הוא חלק מההצגה.</li>`;

  // ---- Story steps ----
  const next = document.getElementById('next');
  const reset = document.getElementById('reset');
  const empties = document.getElementById('empties');
  const word = document.getElementById('word');
  const stepText = document.getElementById('stepText');
  const states = [
    {w:'דעות', t:'המצב ההתחלתי', b:'סובב'},
    {w:'טעות', t:'ה־ד והקוביה הכתומה הסתובבו שמאלה', b:'סובב את כל הקוביות'},
    {w:'סליחה', t:'כל הקוביות הסתובבו שמאלה', b:'הפוך'},
    {w:'חרב', t:'ח־ר־ב התהפכו קדימה, ו ו־ת התהפכו אחורה לצד הפתוח, ב ו־ר החליפו מקום', b:'סדר את המילה'},
    {w:'חבר', t:'ב ו־ר חזרו למקום, ו ו־ת עדיין על הצד הפתוח', b:'השלם את המילה'},
    {w:'חברות', t:'ו ו־ת התהפכו והראו את האותיות', b:'ארוז את הקוביות'},
    {w:'אריזה', t:'כמו בבושקה: הפתח למעלה, והקוביות נכנסות לפי הסדר מהגדולה לקטנה', b:'עוד פעם'}
  ];
  let step = 0, emptyRound = -1;

  const hopper = scene.querySelector('.green'), slider = scene.querySelector('.purple');
  // Trade the ב and ר cubes by flex order, then animate from where they were (FLIP).
  function swap(on, delay){
    if (scene.classList.contains('swapped') === on) return;
    const pair = [hopper, slider];
    const before = pair.map(el => el.getBoundingClientRect().left);
    scene.classList.toggle('swapped', on);
    if (reduce) return;
    pair.forEach((el, i) => {
      const dx = before[i] - el.getBoundingClientRect().left;
      const lift = el === hopper ? -el.offsetHeight * 0.7 : 0;
      el.classList.add('hop');
      el.animate([
        {transform:`translate(${dx}px,0)`},
        {transform:`translate(${dx/2}px,${lift}px)`},
        {transform:'translate(0,0)'}
      ], {duration:1000, delay, easing:'ease-in-out', fill:'backwards'})
        .finished.then(() => el.classList.remove('hop'), () => {});
    });
  }
  function clearPeek(){
    if (typeof stopRig === 'function' && scene.classList.contains('rig')) stopRig();
    if (typeof cancelPack === 'function') cancelPack();
    scene.classList.remove('peek');
    CUBES.forEach(c => c.body.style.transform = '');
    nets.querySelectorAll('[aria-pressed="true"]').forEach(t => t.setAttribute('aria-pressed', 'false'));
    emptyRound = -1;
    empties.textContent = 'הצג את כל הצדדים הריקים';

    packing.forEach(a => a.cancel());

    CUBES.forEach(c => c.el.style.zIndex = '');

  function pack(){
    const outer = scene.querySelector('.orange'), target = outer.getBoundingClientRect();
    outer.style.zIndex = 10;
    const order = ['yellow', 'green', 'purple', 'pink'].map(k => scene.querySelector('.' + k));
    const start = reduce ? 0 : 1300, each = reduce ? 0 : 1500;
    order.forEach((el, i) => {
      const r = el.getBoundingClientRect();
      const dx = (target.left + target.width / 2) - (r.left + r.width / 2);
      const lift = -(outer.offsetHeight + 24);

      packing.push(el.animate([
        {transform:'translate(0,0)'},
        {transform:`translate(0,${lift}px)`, offset:.3},
        {transform:`translate(${dx}px,${lift}px)`, offset:.7},
        {transform:`translate(${dx}px,0)`}
      ], {duration:Math.max(each - 100, 1), delay:start + i * each, easing:'ease-in-out', fill:'both'}));
    });
    packTimer = setTimeout(() => {
      scene.classList.add('xray');
      stepText.textContent = 'הכל ארוז בתוך הכתומה. הקוביות שקופות כאן רק כדי לראות מה בפנים.';
    }, start + order.length * each + 200);
  }
  function show(s){
    clearPeek();
    cancelPack();

    scene.dataset.step = 0;

    tile.setAttribute('aria-pressed', 'true');
    word.textContent = '';
    stepText.textContent = `הקוביה ${cube.name}, ${SIDE_NAME[side]}: ` +
      ({empty:'ריק, אפשר לנצל', hole:'הצד הפתוח', art:'ציור', letter:'אות'})[kind(cube.faces[side])];

  }

  // ---- Backdrop rigging demo ----
  const frame = document.getElementById('frame'), drop = document.getElementById('drop'), roll = document.getElementById('roll');
  const rigBtn = document.getElementById('rigBtn');
  const U = 'var(--u)';
  [0, 25, 50, 75, 100].forEach(x => {
    frame.insertAdjacentHTML('beforeend',
      `<div class="bar v" style="left:calc(${x}% - ${x / 10} * ${U})"></div>` +
      `<div class="velcro" style="top:0;bottom:0;width:calc(4 * ${U});left:calc(${x}% - ${x / 10} * ${U} + 3 * ${U})"></div>`);
  });
  [0, 50, 100].forEach(y => {
    frame.insertAdjacentHTML('beforeend',
      `<div class="bar h" style="top:calc(${y}% - ${y / 10} * ${U})"></div>` +
      `<div class="velcro" style="left:0;right:0;height:calc(4 * ${U});top:calc(${y}% - ${y / 10} * ${U} + 3 * ${U})"></div>`);
  });
  frame.insertAdjacentHTML('beforeend', '<div class="tag">פסי סקוץ׳ על מסגרת האלומיניום</div>');
  let rigTimers = [], rigAnims = [];
  function stopRig(){
    rigTimers.forEach(clearTimeout); rigTimers = [];

  }
  rigBtn.addEventListener('click', () => {
    stopRig();
    clearPeek();
    rigBtn.disabled = true;
    scene.classList.add('rig');
    const fast = reduce ? 0.01 : 1;
    const hidden = drop.animate([{clipPath:'inset(0 0 100% 0)'}], {duration:1, fill:'forwards'});
    rigAnims.push(hidden);
    word.textContent = 'הרכבת הרקע';
    stepText.textContent = '1. מסגרת אלומיניום. על המוטות מודבקים פסי סקוץ׳ (השחורים).';
    const at = (ms, fn) => rigTimers.push(setTimeout(fn, ms * fast));
    at(3000, () => {
      stepText.textContent = '2. מורידים את בד השמיים מלמעלה ומצמידים אותו לסקוץ׳.';
      const h = frame.offsetHeight;
      rigAnims.push(drop.animate([{clipPath:'inset(0 0 100% 0)'}, {clipPath:'inset(0 0 0% 0)'}],
        {duration:3200 * fast, easing:'ease-in-out', fill:'forwards'}));
      rigAnims.push(roll.animate([{opacity:1, transform:'translateY(0)'}, {opacity:1, transform:`translateY(${h - roll.offsetHeight}px)`, offset:.94}, {opacity:0, transform:`translateY(${h}px)`}],
        {duration:3400 * fast, easing:'ease-in-out', fill:'forwards'}));
    });
    at(6600, () => {
      scene.classList.add('press');
      stepText.textContent = '3. לוחצים לאורך הפסים, הבד נצמד ונמתח. אפשר לפרוק ולהחליף בד בקלות.';
    });
    at(10000, () => { stopRig(); show(step); });
  });

  empties.addEventListener('click', () => {
    const round = emptyRound + 1;
    clearPeek();
    const most = Math.max(...CUBES.map(c => SIDES.filter(s => c.faces[s] === null).length));
    if (round >= most) { show(step); return; }
    emptyRound = round;
    scene.classList.add('peek');
    swap(false, 0);
    scene.dataset.step = 0;
    CUBES.forEach(c => {
      const free = SIDES.filter(s => c.faces[s] === null);
      if (free.length) c.body.style.transform = facing(c, free[Math.min(round, free.length - 1)]);
    });
    word.textContent = '';
    stepText.textContent = `צדדים ריקים, סבב ${round + 1} מתוך ${most} (צד שמאל, אחר כך הגב)`;
    empties.textContent = round + 1 < most ? 'הצדדים הריקים הבאים' : 'חזור לסיפור';
    reset.disabled = false;
  });
  next.addEventListener('click', () => show((step + 1) % states.length));
  reset.addEventListener('click', () => show(0));
  show(0);
</script>

<script>
  // ---- 3D stage, in real metres. NN: the big cube is 60 cm, the actors 20 cm taller (80 cm). The rest scale from the drawing. ----
  (function(){

      `הקוביה הכתומה ${Math.round(sizes[0] * 100)} ס״מ והשאר לפי היחס בציור (${sizes.map(s => Math.round(s * 100)).join(', ')} ס״מ). ` +
      `המעבר מאחורי הקוביות: ${CLEAR.toFixed(2)} מ׳ עד הבד. שחקנים בגובה ${Math.round(ACTOR_H * 100)} ס״מ. דולי ${Math.round(DOLLY * 100)}×${Math.round(DOLLY * 100)} ס״מ על 4 גלגלים.`;

    function faceTexture(cube, side){
      const v = cube.faces[side], cv = document.createElement('canvas');
      cv.width = cv.height = 256;
      const g = cv.getContext('2d');
      g.fillStyle = cube.c; g.fillRect(0, 0, 256, 256);
      // Light wood grain under the paint.
      g.strokeStyle = 'rgba(80,45,10,.08)'; g.lineWidth = 2;
      for (let y = 6; y < 256; y += 9) { g.beginPath(); g.moveTo(0, y); g.bezierCurveTo(80, y + 4, 170, y - 4, 256, y + 2); g.stroke(); }
      g.strokeStyle = 'rgba(0,0,0,.18)'; g.lineWidth = 4; g.strokeRect(2, 2, 252, 252);
      if (v === 'hole') {
        g.fillStyle = '#141414'; g.fillRect(24, 24, 208, 208);
      } else if (v && v.art === 'ball') {
        const r = g.createRadialGradient(112, 112, 6, 128, 128, 44);
        r.addColorStop(0, '#6b6b6b'); r.addColorStop(.5, '#1a1a1a'); r.addColorStop(1, '#000');
        g.fillStyle = r; g.beginPath(); g.arc(128, 128, 42, 0, 7); g.fill();
      } else if (v && v.art === 'dots') {
        g.fillStyle = '#000';
        SPOTS.forEach(([x, y]) => { g.beginPath(); g.arc(x * 2.56, y * 2.56, 9, 0, 7); g.fill(); });
      } else if (v) {
        if (v.w) { g.fillStyle = '#fff'; WDOTS.forEach(([x, y]) => { g.beginPath(); g.arc(x * 2.56, y * 2.56, 6, 0, 7); g.fill(); }); }
        g.fillStyle = '#1b2f86'; g.font = '900 150px "Frank Ruhl Libre", serif';
        g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(v.w || v, 128, 136);

      t.anisotropy = 4;
      return t;
    }
    function label(text, w){
      const cv = document.createElement('canvas'); cv.width = 512; cv.height = 128;
      const g = cv.getContext('2d');
      g.fillStyle = 'rgba(255,211,77,.95)'; g.fillRect(4, 14, 504, 100);
      g.fillStyle = '#1c2733'; g.font = '700 54px Assistant, sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
      g.direction = 'rtl'; g.fillText(text, 256, 66);
      const s = new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(cv), depthTest:false}));
      s.scale.set(w, w / 4, 1);
      s.renderOrder = 10;
      return s;
    }
    function skyTexture(){
      const cv = document.createElement('canvas'); cv.width = 1024; cv.height = 512;
      const g = cv.getContext('2d');
      const lg = g.createLinearGradient(0, 0, 0, 512);
      lg.addColorStop(0, '#2f7fd0'); lg.addColorStop(.55, '#5ea8e6'); lg.addColorStop(1, '#a9d4f5');
      g.fillStyle = lg; g.fillRect(0, 0, 1024, 512);
      g.fillStyle = '#fff';

    }
    function actor(shirt){
      const a = new THREE.Group(), skin = new THREE.MeshStandardMaterial({color:0xe0b08a});
      const pants = new THREE.MeshStandardMaterial({color:0x2a2f3a}), top = new THREE.MeshStandardMaterial({color:shirt});

      const arm = () => { const m = new THREE.Mesh(new THREE.CylinderGeometry(.05, .045, .6, 10), top); m.geometry.translate(0, -.3, 0); return m; };
      const legL = leg(), legR = leg(), armL = arm(), armR = arm();
      legL.position.set(-.09, .85, 0); legR.position.set(.09, .85, 0);
      armL.position.set(-.25, 1.43, 0); armR.position.set(.25, 1.43, 0);
      const torso = new THREE.Mesh(new THREE.CylinderGeometry(.19, .16, .6, 16), top); torso.position.y = 1.15;
      const head = new THREE.Mesh(new THREE.SphereGeometry(.12, 20, 16), skin); head.position.y = 1.6;
      const body = new THREE.Group();
      [legL, legR, torso, head, armL, armR].forEach(m => { m.castShadow = true; body.add(m); });
      body.scale.setScalar(ACTOR_H / 1.72);
      a.add(body);
      a.userData = {legL, legR, armL, armR};
      return a;
    }

    let renderer, camera, controls, walker, stander, dolly, wheels = [], total, started = false, dragT0 = null;
    const cubeMesh = [], home = [];
    const views = {
      audience:{p:[0, 1.5, 5.6], t:[0, .8, -.6]},
      side:{p:[5.2, 2.3, .4], t:[0, .5, -.9]},
      top:{p:[0, 7.5, -.6001], t:[0, 0, -.6]},
      back:{p:[-2.8, 2.1, -3.6], t:[0, .6, -.4]}

    // Pack & drag out: the smaller cubes drop into the orange one, it goes onto the dolly, actor 1 pulls it off stage.
    const dollyHomeX = () => home[0].x - sizes[0] / 2 - .15 - DOLLY / 2;
    function resetDrag(){
      dragT0 = null;
      cubeMesh.forEach((m, i) => { m.position.copy(home[i]); m.visible = true; });
      dolly.position.set(dollyHomeX(), 0, 0);
      wheels.forEach(w => w.rotation.z = 0);
      stander.position.set(home[0].x, sizes[0], 0); stander.rotation.y = .3;

    }
    function setView(k){
      const v = views[k]; camera.position.set(...v.p); controls.target.set(...v.t); controls.update();

    }

      renderer = new THREE.WebGLRenderer({antialias:true});
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
      renderer.shadowMap.enabled = true;
      host.appendChild(renderer.domElement);
      const scene3 = new THREE.Scene();
      scene3.background = new THREE.Color(0x1d232b);
      camera = new THREE.PerspectiveCamera(45, 1.6, .05, 60);

      controls.enableDamping = true; controls.maxPolarAngle = Math.PI / 2 - .02; controls.minDistance = 1.5; controls.maxDistance = 14;
      fit();

      scene3.add(new THREE.HemisphereLight(0xffffff, 0x445566, .75));
      const sun = new THREE.DirectionalLight(0xffffff, .8);
      sun.position.set(3, 6, 5); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
      Object.assign(sun.shadow.camera, {left:-5, right:5, top:5, bottom:-5});
      scene3.add(sun);

      // Stage floor.
      const floor = new THREE.Mesh(new THREE.BoxGeometry(7, .08, 4.6), new THREE.MeshStandardMaterial({color:0x3b2e25, roughness:.9}));
      floor.position.set(0, -.04, backdropZ + 2.1); floor.receiveShadow = true; scene3.add(floor);

      // Backdrop: one sky fabric on an aluminium frame.
      const bw = 4.6, bh = 2.7;
      const sky = new THREE.Mesh(new THREE.PlaneGeometry(bw, bh), new THREE.MeshStandardMaterial({map:skyTexture(), roughness:1}));
      sky.position.set(0, bh / 2, backdropZ); sky.receiveShadow = true; scene3.add(sky);
      // Back of the fabric, as the crew sees it backstage.
      const backCloth = new THREE.Mesh(new THREE.PlaneGeometry(bw, bh), new THREE.MeshStandardMaterial({color:0xd9d4c7, roughness:1}));
      backCloth.rotation.y = Math.PI; backCloth.position.set(0, bh / 2, backdropZ - .005); scene3.add(backCloth);
      const alu = new THREE.MeshStandardMaterial({color:0xb9c0c7, metalness:.7, roughness:.35});
      [-bw / 2, -bw / 4, 0, bw / 4, bw / 2].forEach(x => {
        const post = new THREE.Mesh(new THREE.BoxGeometry(.05, bh, .05), alu); post.position.set(x, bh / 2, backdropZ - .04); scene3.add(post);
      });
      [0, bh / 2, bh].forEach(y => {
        const rail = new THREE.Mesh(new THREE.BoxGeometry(bw, .05, .05), alu); rail.position.set(0, y, backdropZ - .04); scene3.add(rail);
      });
      [-bw / 2, bw / 2].forEach(x => {
        const foot = new THREE.Mesh(new THREE.BoxGeometry(.06, .04, .7), alu); foot.position.set(x, .02, backdropZ - .3); scene3.add(foot);
      });

      total = sizes.reduce((a, b) => a + b, 0) + GAP * (sizes.length - 1);
      let x = -total / 2;

      lane.rotation.x = -Math.PI / 2; lane.position.set(0, .005, (backOfCubes + backdropZ) / 2); scene3.add(lane);
      const dimX = total / 2 + .35, yellow = new THREE.LineBasicMaterial({color:0xffd34d});
      const seg = (a, b) => scene3.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([a, b]), yellow));
      seg(new THREE.Vector3(dimX, .01, backOfCubes), new THREE.Vector3(dimX, .01, backdropZ));
      [backOfCubes, backdropZ].forEach(z => seg(new THREE.Vector3(dimX - .12, .01, z), new THREE.Vector3(dimX + .12, .01, z)));
      const dl = label(`מעבר ${CLEAR.toFixed(2)} מ׳`, .9); dl.position.set(dimX + .1, .35, (backOfCubes + backdropZ) / 2); scene3.add(dl);

      // Actor 1 walks the corridor; actor 2 stands on the big orange cube.
      walker = actor(0x2f6fd6); walker.position.set(0, 0, (backOfCubes + backdropZ) / 2); scene3.add(walker);
      stander = actor(0xd64b4b);
      stander.position.set(cubePos[0].x, sizes[0], 0); stander.rotation.y = .3; scene3.add(stander);
      const l1 = label('שחקן 1', .75); l1.position.set(0, ACTOR_H + .2, 0); walker.add(l1);
      const l2 = label('שחקן 2', .75); l2.position.set(0, ACTOR_H + .2, 0); stander.add(l2);

      // Dolly: wooden board on four casters, with a pull handle on its left side.
      dolly = new THREE.Group();
      const wood = new THREE.MeshStandardMaterial({color:0xa8743f, roughness:.8});
      const board = new THREE.Mesh(new THREE.BoxGeometry(DOLLY, .04, DOLLY), wood);
      board.position.y = .1; board.castShadow = board.receiveShadow = true; dolly.add(board);
      const rubber = new THREE.MeshStandardMaterial({color:0x222222, roughness:.6});
      const hub = new THREE.MeshStandardMaterial({color:0xcccccc, metalness:.6, roughness:.4});
      [[-1, -1], [-1, 1], [1, -1], [1, 1]].forEach(([sx, sz]) => {
        const w = new THREE.Group();
        const tyre = new THREE.Mesh(new THREE.CylinderGeometry(.04, .04, .03, 16), rubber); tyre.rotation.x = Math.PI / 2;
        const spoke = new THREE.Mesh(new THREE.BoxGeometry(.075, .012, .032), hub);
        w.add(tyre, spoke); w.position.set(sx * (DOLLY / 2 - .07), .04, sz * (DOLLY / 2 - .07));
        const fork = new THREE.Mesh(new THREE.BoxGeometry(.06, .04, .05), hub); fork.position.set(w.position.x, .07, w.position.z);
        dolly.add(w, fork); wheels.push(w);
      });
      const handle = new THREE.Mesh(new THREE.CylinderGeometry(.012, .012, .5, 8), hub);
      handle.position.set(-DOLLY / 2 - .2, .26, 0); handle.rotation.z = -1.0; dolly.add(handle);
      scene3.add(dolly);
      const ld = label('דולי', .5); ld.position.set(0, .2, DOLLY / 2 + .15); dolly.add(ld);
      resetDrag();

      setView('audience');
      addEventListener('resize', () => { if (dlg.open) fit(); });
      requestAnimationFrame(loop);
      function loop(t){
        requestAnimationFrame(loop);
        if (!dlg.open) return;
        const span = total / 2 + .2, sec = t / 1000;
        if (dragT0 !== null) dragStep((t - dragT0) / 1000, sec);
        else if (!reduce) {
          const ph = (sec * .22) % 2, f = ph < 1 ? ph : 2 - ph;
          walker.position.x = -span + f * 2 * span;
          walker.rotation.y = ph < 1 ? Math.PI / 2 : -Math.PI / 2;
          const sw = Math.sin(sec * 7) * .45, u = walker.userData;
          u.legL.rotation.x = sw; u.legR.rotation.x = -sw; u.armL.rotation.x = -sw * .7; u.armR.rotation.x = sw * .7;
        }
        controls.update();
        renderer.render(scene3, camera);
      }
    }
    document.getElementById('open3d').addEventListener('click', () => {
      dlg.showModal();
      if (!window.THREE || !THREE.OrbitControls) { host.textContent = 'התלת מימד לא נטען. נסה לרענן.'; return; }
      if (!started) (document.fonts ? document.fonts.ready : Promise.resolve()).then(build);
      else fit();
    });
    document.getElementById('close3d').addEventListener('click', () => dlg.close());
    document.getElementById('drag3d').addEventListener('click', e => {
      if (!started) return;
      if (dragT0 !== null) { resetDrag(); return; }
      dragT0 = performance.now();
      e.currentTarget.textContent = '■ החזר';
    });
    document.querySelectorAll('.view').forEach(b => b.addEventListener('click', () => { if (started) setView(b.dataset.view); }));
  })();
</script>

</html>
