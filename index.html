<!doctype html><html lang="he"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>תפאורה שחורצי</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@900&family=Assistant:wght@500;700&display=swap">
<style>
  :root{
    --wall:#4a9fd6; --floor:#b9c6d2; --ink:#1b2f86; --paper:#f3f6f9; --text:#1c2733; --muted:#5b6b7a;
    --u:min(1px, calc((100vw - 32px) / 640));
    color-scheme:light;
  }
  html,body{background:var(--paper);color:var(--text)}
  body{font-family:"Assistant",system-ui,sans-serif;padding-inline:16px;padding-block:24px 40px;margin:0}
  .wrap{max-width:900px;margin:0 auto;display:grid;gap:20px}
  h1{margin:0;font:700 22px/1.2 "Assistant",sans-serif;text-wrap:balance}
  h2{margin:0;font:700 19px/1.2 "Assistant",sans-serif}
  .scene{position:relative;border-radius:10px;overflow:hidden;
    background:linear-gradient(#2e3640 0 66%, var(--floor) 66% 100%);
    padding-block:calc(200 * var(--u)) calc(34 * var(--u));
    display:flex;justify-content:center;align-items:flex-end;gap:calc(18 * var(--u));direction:ltr}

  /* Backdrop: one continuous sky-print fabric, stretched over the aluminium frame from the floor up. */
  .drop{position:absolute;z-index:0;inset:0 0 34% 0;box-sizing:border-box;
    border:calc(6 * var(--u)) solid #b9c0c7;border-bottom:0;
    border-image:linear-gradient(135deg,#eef1f4,#9aa3ac 45%,#d7dce1 70%,#8b949d) 1;
    background:
      radial-gradient(ellipse 9% 5% at 14% 22%,#fff 0 55%,transparent 72%),
      radial-gradient(ellipse 7% 6% at 19% 19%,#fff 0 55%,transparent 72%),
      radial-gradient(ellipse 8% 4.5% at 23% 24%,#fbfdff 0 55%,transparent 72%),
      radial-gradient(ellipse 11% 5% at 63% 14%,#fff 0 55%,transparent 72%),
      radial-gradient(ellipse 7% 6.5% at 69% 10%,#fff 0 55%,transparent 72%),
      radial-gradient(ellipse 9% 4.5% at 75% 15%,#f7fbff 0 55%,transparent 72%),
      radial-gradient(ellipse 8% 4% at 42% 46%,rgba(255,255,255,.85) 0 50%,transparent 72%),
      radial-gradient(ellipse 6% 4% at 46% 43%,rgba(255,255,255,.85) 0 50%,transparent 72%),
      radial-gradient(ellipse 10% 4% at 88% 52%,rgba(255,255,255,.8) 0 50%,transparent 72%),
      radial-gradient(ellipse 9% 3.5% at 6% 58%,rgba(255,255,255,.75) 0 50%,transparent 72%),
      linear-gradient(#2f7fd0,#5ea8e6 55%,#a9d4f5)}
  .cube{--z:calc(var(--s) * var(--u));width:var(--z);height:var(--z);flex:none;z-index:1;
    perspective:calc(var(--z) * 5);perspective-origin:28% 8%}
  .body{position:relative;width:100%;height:100%;transform-style:preserve-3d;
    transition:transform 1.1s cubic-bezier(.55,-.15,.3,1.25)}
  .f{position:absolute;inset:0;display:grid;place-items:center;background:var(--c);
    border:1px solid rgba(0,0,0,.14);backface-visibility:hidden;
    font:900 calc(var(--z) * .5)/1 "Frank Ruhl Libre","David","Times New Roman",serif;color:var(--ink)}
  .front{transform:translateZ(calc(var(--z) / 2))}
  .left{transform:rotateY(-90deg) translateZ(calc(var(--z) / 2));filter:brightness(.93)}
  .back{transform:rotateY(180deg) translateZ(calc(var(--z) / 2))}
  .right{transform:rotateY(90deg) translateZ(calc(var(--z) / 2))}
  .top{transform:rotateX(90deg) translateZ(calc(var(--z) / 2))}
  .bottom{transform:rotateX(-90deg) translateZ(calc(var(--z) / 2))}
  .f b{display:block;transform:rotate(var(--r,0deg))}
  /* The open side: a rim of the cube colour around a dark hollow, so the cubes nest. */
  .hole::after{content:"";position:absolute;inset:9%;border-radius:2px;
    background:radial-gradient(ellipse at 50% 35%,#4a4a4a 0,#1d1d1d 55%,#090909 100%);
    box-shadow:inset 0 calc(var(--z) * .05) calc(var(--z) * .08) rgba(0,0,0,.8)}
  .ball{width:32%;height:32%;border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#6b6b6b 0,#1a1a1a 38%,#000 70%);
    box-shadow:calc(var(--z) * .04) calc(var(--z) * .06) calc(var(--z) * .08) rgba(0,0,0,.45)}
  .wdot{position:absolute;width:4.8%;height:4.8%;border-radius:50%;background:#fff;transform:translate(-50%,-50%)}
  .dot{position:absolute;left:var(--x);top:var(--y);width:7%;height:7%;border-radius:50%;background:#000;transform:translate(-50%,-50%)}

  /* Steps 1-2 turn cubes a quarter to the left. Step 3 tips ח-ר-ב forward onto their tops,
     while ו and ת tip backward and show their open side. Step 4 puts ב/ר back (חבר) while ו and ת stay open; step 5 flips them over: חברות. */
  .body{transform:rotateX(0deg) rotateY(0deg)}
  .scene[data-step="1"] .pink .body,.scene[data-step="1"] .orange .body{transform:rotateX(0deg) rotateY(-90deg)}
  .scene[data-step="2"] .body{transform:rotateX(0deg) rotateY(-90deg)}
  .scene[data-step="2"] .pink .body,.scene[data-step="2"] .orange .body{transform:rotateX(0deg) rotateY(-180deg)}
  .scene:is([data-step="3"],[data-step="4"],[data-step="5"]) .body{transform:rotateX(-90deg) rotateY(-90deg)}
  .scene:is([data-step="3"],[data-step="4"],[data-step="5"]) :is(.pink,.orange) .body{transform:rotateX(-90deg) rotateY(-180deg)}
  .scene:is([data-step="3"],[data-step="4"]) .yellow .body{transform:rotateX(90deg) rotateY(-90deg)}
  .scene:is([data-step="3"],[data-step="4"]) .orange .body{transform:rotateX(90deg) rotateY(-180deg)}
  .scene[data-step="1"] .orange .body{transition-delay:.25s}
  .scene[data-step="2"] .purple .body,.scene[data-step="3"] .purple .body{transition-delay:.15s}
  .scene[data-step="2"] .green .body,.scene[data-step="3"] .green .body{transition-delay:.3s}
  .scene[data-step="2"] .yellow .body,.scene[data-step="3"] .yellow .body{transition-delay:.45s}
  .scene[data-step="2"] .orange .body,.scene[data-step="3"] .orange .body{transition-delay:.6s}
  .scene[data-step="5"] .orange .body{transition-delay:.2s}
  .scene.peek .body{transition-delay:0s!important}

  /* ב and ר trade places in step 3 (script) and come back in step 4. */
  .cube{position:relative}
  .orange{order:1}.yellow{order:2}.green{order:3}.purple{order:4}.pink{order:5}
  .scene.swapped .green{order:4}.scene.swapped .purple{order:3}
  .hop{z-index:2}
  /* Packing (last step): every cube back on its open bottom, ready to be lowered over the next smaller one. */
  .scene[data-step="6"] .body{transform:rotateX(0deg) rotateY(0deg);transition-delay:0s}
  .scene.xray .cube:not(.pink){opacity:.5}
  .scene .cube{transition:opacity .6s ease}

  .panel{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
  .word{font:900 34px/1 "Frank Ruhl Libre",serif;color:var(--ink);min-height:34px;letter-spacing:.04em}
  .steps{color:var(--muted);font-size:14px}
  .btns{display:flex;gap:10px;flex-wrap:wrap}
  button{font:700 16px/1 "Assistant",sans-serif;border-radius:8px;padding:13px 20px;cursor:pointer;border:2px solid var(--ink)}
  #next{background:var(--ink);color:#fff}
  #reset,#empties{background:transparent;color:var(--ink)}
  button:focus-visible{outline:3px solid #e8784a;outline-offset:2px}
  button:disabled{opacity:.45;cursor:default}

  /* Face map: every cube unfolded, so the free sides are easy to spot. */
  .faces{display:grid;gap:14px;border-top:1px solid #d5dde5;padding-top:20px}
  .lead{margin:0;color:var(--muted);font-size:15px;line-height:1.5}
  .tally{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:15px}
  .tally span{display:inline-flex;align-items:center;gap:6px}
  .sw{width:14px;height:14px;border-radius:3px;display:inline-block}
  .nets{direction:ltr;display:flex;flex-wrap:wrap;gap:18px 22px;justify-content:center}
  .net{display:grid;gap:6px;justify-items:center}
  .net h3{margin:0;font:700 15px/1 "Assistant",sans-serif}
  .grid{direction:ltr;display:grid;grid-template-columns:repeat(4,40px);grid-template-rows:repeat(3,40px);gap:3px}
  .tile{display:grid;place-items:center;border-radius:4px;background:var(--c);color:var(--ink);cursor:pointer;
    font:900 21px/1 "Frank Ruhl Libre",serif;border:2px solid transparent;padding:0;position:relative}
  .tile small{font:700 11px/1 "Assistant",sans-serif}
  .tile.empty{background:#fff;border:2px dashed var(--c);color:#3d4a57}
  .tile.hole{background:#1d1d1d;color:#fff;border-color:var(--c)}
  .tile.art{font-size:13px}
  .tile[aria-pressed="true"]{outline:3px solid var(--ink);outline-offset:1px}
  .ideas{margin:0;padding-inline-start:20px;line-height:1.6;font-size:15px}
  @media (prefers-reduced-motion:reduce){.body,.ball{transition-duration:.01s!important;transition-delay:0s!important}}
</style>

<div class="wrap" dir="rtl">
  <h1>תפאורה שחורצי</h1>

  <div class="scene" id="scene" data-step="0" aria-live="polite">
    <div class="drop" aria-hidden="true"></div>
  </div>

  <div class="panel">
    <div>
      <div class="word" id="word">דעות</div>
      <div class="steps" id="stepText">המצב ההתחלתי</div>
    </div>
    <div class="btns">
      <button id="next" type="button">סובב</button>
      <button id="reset" type="button" disabled>מההתחלה</button>
    </div>
  </div>

  <section class="faces" aria-labelledby="facesTitle">
    <h2 id="facesTitle">אילו צדדים פנויים?</h2>
    <p class="lead">כל קוביה פרושה לשש הפאות שלה. לחיצה על פאה מסובבת את הקוביה למעלה כך שהפאה הזו פונה לקהל.</p>
    <div class="tally" id="tally"></div>
    <div class="nets" id="nets"></div>
    <div class="btns"><button id="empties" type="button">הצג את כל הצדדים הריקים</button></div>
    <ul class="ideas" id="ideas"></ul>
  </section>
</div>


<script>
  // One place that says what is painted on every side of every cube.
  // null = empty side, 'hole' = the open side the cubes nest through.
  // The pink cube is the innermost one, so it is closed all round.
  const CUBES = [
    {k:'orange', name:'הכתומה', s:130, c:'#e8784a', end:-180,
      faces:{front:{art:'ball'}, right:{art:'dots'}, back:'ה', left:null, top:{w:'ת'}, bottom:'hole'}},
    {k:'yellow', name:'הצהובה', s:118, c:'#e8c957', end:-90,
      faces:{front:'ת', right:'ח', back:null, left:null, top:{w:'ו'}, bottom:'hole'}},
    {k:'green', name:'הירוקה', s:106, c:'#9ccb82', end:-90,
      faces:{front:'ו', right:'י', back:null, left:null, top:{w:'ר'}, bottom:'hole'}},
    {k:'purple', name:'הסגולה', s:96, c:'#bb8cd2', end:-90,
      faces:{front:'ע', right:'ל', back:null, left:null, top:{w:'ב'}, bottom:'hole'}},
    {k:'pink', name:'הוורודה', s:86, c:'#db8f98', end:-180,
      faces:{front:'ד', right:'ט', back:'ס', left:null, top:{w:'ח'}, bottom:null}}
  ];
  const SIDES = ['front','right','back','left','top','bottom'];
  const SIDE_NAME = {front:'חזית', right:'צד ימין', back:'גב', left:'צד שמאל', top:'למעלה', bottom:'למטה'};
  // Net position (column,row) in a cross: top above the front, bottom below it.
  const NET = {top:[2,1], left:[1,2], front:[2,2], right:[3,2], back:[4,2], bottom:[2,3]};
  const SPOTS = [[21,27],[70,22],[42,48],[79,64],[26,76],[59,83]];
  const WDOTS = [[13,15],[37,12],[66,17],[87,14],[22,34],[51,29],[79,37],[12,54],[33,61],[73,59],[89,68],[20,81],[48,86],[78,82]];

  const scene = document.getElementById('scene');
  const kind = v => v === null ? 'empty' : v === 'hole' ? 'hole' : (v.art ? 'art' : 'letter');

  CUBES.forEach((cube, i) => {
    const el = document.createElement('div');
    el.className = 'cube ' + cube.k;
    el.style.cssText = `--s:${cube.s};--c:${cube.c}`;
    const body = document.createElement('div');
    body.className = 'body';
    SIDES.forEach(side => {
      const v = cube.faces[side], f = document.createElement('div');
      f.className = 'f ' + side;
      if (v === 'hole') f.classList.add('hole');
      else if (typeof v === 'string') f.textContent = v;
      else if (v && v.art === 'ball') f.innerHTML = '<span class="ball"></span>';
      else if (v && v.art === 'dots') f.innerHTML = SPOTS.map(([x, y]) => `<span class="dot" style="--x:${x}%;--y:${y}%"></span>`).join('');
      else if (v && v.w) {
        // The חברות letters sit on top; turn them so they read upright once tipped forward.
        f.innerHTML = `<b style="--r:${cube.end === -180 ? 180 : -90}deg">${v.w}</b>`;
        WDOTS.forEach(([x, y]) => {
          const d = document.createElement('span');
          d.className = 'wdot';
          d.style.left = (i % 2 ? 100 - x : x) + '%';
          d.style.top = y + '%';
          f.appendChild(d);
        });
      }
      body.appendChild(f);
    });
    el.appendChild(body);
    scene.appendChild(el);
    cube.el = el;
    cube.body = body;
  });

  // Turn one cube so the chosen side faces the audience.
  const facing = (cube, side) => ({
    front:'rotateX(0deg) rotateY(0deg)', right:'rotateX(0deg) rotateY(-90deg)',
    back:'rotateX(0deg) rotateY(-180deg)', left:'rotateX(0deg) rotateY(90deg)',
    top:`rotateX(-90deg) rotateY(${cube.end}deg)`, bottom:'rotateX(90deg) rotateY(0deg)'
  })[side];

  // ---- Face map ----
  const nets = document.getElementById('nets');
  const count = {letter:0, art:0, empty:0, hole:0};
  CUBES.forEach(cube => {
    const box = document.createElement('div');
    box.className = 'net';
    box.innerHTML = `<h3>${cube.name}</h3>`;
    const grid = document.createElement('div');
    grid.className = 'grid';
    grid.style.setProperty('--c', cube.c);
    SIDES.forEach(side => {
      const v = cube.faces[side], k = kind(v), t = document.createElement('button');
      count[k]++;
      t.type = 'button';
      t.className = 'tile ' + k;
      t.style.gridArea = `${NET[side][1]} / ${NET[side][0]}`;
      t.setAttribute('aria-pressed', 'false');
      t.title = SIDE_NAME[side];
      t.innerHTML = k === 'empty' ? '<small>ריק</small>' : k === 'hole' ? '<small>חור</small>'
        : k === 'art' ? (v.art === 'ball' ? '⚫' : '⁘') : (v.w || v);
      t.addEventListener('click', () => peekOne(cube, side, t));
      grid.appendChild(t);
    });
    box.appendChild(grid);
    nets.appendChild(box);
  });
  const sw = c => `<i class="sw" style="${c}"></i>`;
  document.getElementById('tally').innerHTML =
    `<span>${sw('background:#e8c957')}${count.letter} עם אות</span>` +
    `<span>${sw('background:#e8784a')}${count.art} עם ציור</span>` +
    `<span>${sw('background:#fff;border:2px dashed #8a97a5')}<b>${count.empty} ריקים</b></span>` +
    `<span>${sw('background:#1d1d1d')}${count.hole} חורים (צד פתוח)</span>`;
  const emptyLeft = CUBES.filter(c => c.faces.left === null).length;
  const emptyBack = CUBES.filter(c => c.faces.back === null).map(c => c.name);
  document.getElementById('ideas').innerHTML =
    `<li>צד שמאל ריק ב־${emptyLeft} הקוביות: סיבוב של כולן ימינה יכול לחשוף מילה נוספת של ${emptyLeft} אותיות.</li>` +
    `<li>הגב ריק ב${emptyBack.join(', ')}: מקום למילה של ${emptyBack.length} אותיות, או לנקודות כמו בכתומה.</li>` +
    `<li>החור תמיד על הרצפה, חוץ מהרגע שבו ו ו־ת מתהפכות אליו, אז הוא חלק מההצגה.</li>`;

  // ---- Story steps ----
  const next = document.getElementById('next');
  const reset = document.getElementById('reset');
  const empties = document.getElementById('empties');
  const word = document.getElementById('word');
  const stepText = document.getElementById('stepText');
  const states = [
    {w:'דעות', t:'המצב ההתחלתי', b:'סובב'},
    {w:'טעות', t:'ה־ד והקוביה הכתומה הסתובבו שמאלה', b:'סובב את כל הקוביות'},
    {w:'סליחה', t:'כל הקוביות הסתובבו שמאלה', b:'הפוך'},
    {w:'חרב', t:'ח־ר־ב התהפכו קדימה, ו ו־ת התהפכו אחורה לצד הפתוח, ב ו־ר החליפו מקום', b:'סדר את המילה'},
    {w:'חבר', t:'ב ו־ר חזרו למקום, ו ו־ת עדיין על הצד הפתוח', b:'השלם את המילה'},
    {w:'חברות', t:'ו ו־ת התהפכו והראו את האותיות', b:'ארוז את הקוביות'},
    {w:'אריזה', t:'כמו בבושקה: הפתח למטה, וכל קוביה יורדת על הקטנה ממנה', b:'עוד פעם'}
  ];
  let step = 0, emptyRound = -1;
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const hopper = scene.querySelector('.green'), slider = scene.querySelector('.purple');
  // Trade the ב and ר cubes by flex order, then animate from where they were (FLIP).
  function swap(on, delay){
    if (scene.classList.contains('swapped') === on) return;
    const pair = [hopper, slider];
    const before = pair.map(el => el.getBoundingClientRect().left);
    scene.classList.toggle('swapped', on);
    if (reduce) return;
    pair.forEach((el, i) => {
      const dx = before[i] - el.getBoundingClientRect().left;
      const lift = el === hopper ? -el.offsetHeight * 0.7 : 0;
      el.classList.add('hop');
      el.animate([
        {transform:`translate(${dx}px,0)`},
        {transform:`translate(${dx/2}px,${lift}px)`},
        {transform:'translate(0,0)'}
      ], {duration:1000, delay, easing:'ease-in-out', fill:'backwards'})
        .finished.then(() => el.classList.remove('hop'), () => {});
    });
  }
  function clearPeek(){
    if (typeof cancelPack === 'function') cancelPack();
    scene.classList.remove('peek');
    CUBES.forEach(c => c.body.style.transform = '');
    nets.querySelectorAll('[aria-pressed="true"]').forEach(t => t.setAttribute('aria-pressed', 'false'));
    emptyRound = -1;
    empties.textContent = 'הצג את כל הצדדים הריקים';
  }
  // Matryoshka packing: purple drops over pink, green over purple, and so on up to orange.
  let packing = [], packTimer = 0;
  function cancelPack(){
    packing.forEach(a => a.cancel());
    packing = [];
    clearTimeout(packTimer);
    scene.classList.remove('xray');
    CUBES.forEach(c => c.el.style.zIndex = '');
  }
  function pack(){
    const target = scene.querySelector('.pink').getBoundingClientRect();
    const order = ['purple', 'green', 'yellow', 'orange'].map(k => scene.querySelector('.' + k));
    const start = reduce ? 0 : 1300, each = reduce ? 0 : 1500;
    order.forEach((el, i) => {
      const r = el.getBoundingClientRect();
      const dx = (target.left + target.width / 2) - (r.left + r.width / 2);
      const lift = -(el.offsetHeight + 14);
      el.style.zIndex = 3 + i;
      packing.push(el.animate([
        {transform:'translate(0,0)'},
        {transform:`translate(0,${lift}px)`, offset:.3},
        {transform:`translate(${dx}px,${lift}px)`, offset:.7},
        {transform:`translate(${dx}px,0)`}
      ], {duration:Math.max(each - 100, 1), delay:start + i * each, easing:'ease-in-out', fill:'both'}));
    });
    packTimer = setTimeout(() => {
      scene.classList.add('xray');
      stepText.textContent = 'הכל ארוז בתוך הכתומה. הקוביות שקופות כאן רק כדי לראות מה בפנים.';
    }, start + order.length * each + 200);
  }
  function show(s){
    clearPeek();
    cancelPack();
    step = s;
    scene.dataset.step = s;
    swap(s === 3, s === 3 ? 700 : 0);
    word.textContent = states[s].w;
    stepText.textContent = states[s].t;
    next.textContent = states[s].b;
    reset.disabled = s === 0;
    if (s === 6) pack();
  }
  function peekOne(cube, side, tile){
    const was = tile.getAttribute('aria-pressed') === 'true';
    clearPeek();
    if (was) { show(step); return; }
    scene.classList.add('peek');
    swap(false, 0);
    scene.dataset.step = 0;
    cube.body.style.transform = facing(cube, side);
    tile.setAttribute('aria-pressed', 'true');
    word.textContent = '';
    stepText.textContent = `הקוביה ${cube.name}, ${SIDE_NAME[side]}: ` +
      ({empty:'ריק, אפשר לנצל', hole:'הצד הפתוח', art:'ציור', letter:'אות'})[kind(cube.faces[side])];
    reset.disabled = false;
  }
  // Cycle every cube to its free sides: first round the left sides, then the backs.
  empties.addEventListener('click', () => {
    const round = emptyRound + 1;
    clearPeek();
    const most = Math.max(...CUBES.map(c => SIDES.filter(s => c.faces[s] === null).length));
    if (round >= most) { show(step); return; }
    emptyRound = round;
    scene.classList.add('peek');
    swap(false, 0);
    scene.dataset.step = 0;
    CUBES.forEach(c => {
      const free = SIDES.filter(s => c.faces[s] === null);
      if (free.length) c.body.style.transform = facing(c, free[Math.min(round, free.length - 1)]);
    });
    word.textContent = '';
    stepText.textContent = `צדדים ריקים, סבב ${round + 1} מתוך ${most} (צד שמאל, אחר כך הגב)`;
    empties.textContent = round + 1 < most ? 'הצדדים הריקים הבאים' : 'חזור לסיפור';
    reset.disabled = false;
  });
  next.addEventListener('click', () => show((step + 1) % states.length));
  reset.addEventListener('click', () => show(0));
  show(0);
</script>

</html>
